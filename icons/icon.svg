<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0e1a"/>

  <!-- Stick shaft (top-left to lower-right) -->
  <line x1="100" y1="100" x2="320" y2="370" stroke="#c8d8ff" stroke-width="28" stroke-linecap="round"/>

  <!-- Blade (flat, at bottom of shaft, pointing right) -->
  <rect x="305" y="358" width="120" height="30" rx="12" fill="#c8d8ff" transform="rotate(-10, 305, 358)"/>

  <!-- Puck (separate, being hit) -->
  <!-- Bottom ellipse (shadow/side) -->
  <ellipse cx="360" cy="418" rx="52" ry="14" fill="#0d1a33"/>
  <!-- Top face -->
  <ellipse cx="360" cy="410" rx="52" ry="14" fill="#1e2a4a" stroke="#4a9eff" stroke-width="4"/>
  <!-- Shine -->
  <ellipse cx="352" cy="407" rx="20" ry="5" fill="#2a3a5a" opacity="0.8"/>
</svg>
