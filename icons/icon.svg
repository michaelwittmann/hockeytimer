  <rect x="242" y="116" width="11" height="40" rx="5" fill="#0d0600"/>
  <rect x="198" y="154" width="52" height="11" rx="5" fill="#ff2200"/>

  <!-- Colon 1 — x:262 -->
  <circle cx="271" cy="102" r="7" fill="#ff2200"/>
  <circle cx="271" cy="130" r="7" fill="#ff2200"/>

  <!-- "0" — x:280 -->
  <rect x="288" y="62"  width="52" height="11" rx="5" fill="#ff2200"/>
  <rect x="280" y="69"  width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="332" y="69"  width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="288" y="107" width="52" height="11" rx="5" fill="#0d0600"/>
  <rect x="280" y="116" width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="332" y="116" width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="288" y="154" width="52" height="11" rx="5" fill="#ff2200"/>

  <!-- "0" — x:350 -->
  <rect x="358" y="62"  width="52" height="11" rx="5" fill="#ff2200"/>
  <rect x="350" y="69"  width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="402" y="69"  width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="358" y="107" width="52" height="11" rx="5" fill="#0d0600"/>
  <rect x="350" y="116" width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="402" y="116" width="11" height="40" rx="5" fill="#ff2200"/>
  <rect x="358" y="154" width="52" height="11" rx="5" fill="#ff2200"/>

  <!-- Colon 2 — x:412 -->
  <circle cx="421" cy="102" r="7" fill="#ff2200"/>
  <circle cx="421" cy="130" r="7" fill="#ff2200"/>

  <!-- "0" (tenths) — smaller, x:430 -->
  <rect x="434" y="72"  width="36" height="9"  rx="4" fill="#ff2200"/>
  <rect x="428" y="78"  width="9"  height="30" rx="4" fill="#ff2200"/>
  <rect x="470" y="78"  width="9"  height="30" rx="4" fill="#ff2200"/>
